openapi: 3.1.0
info:
  title: Khana KarLo pilot API
  version: 1.0.0
  description: Language-neutral contracts for the pilot clients and backend services.
servers:
  - url: /v1
paths:
  /identity/sessions/google:
    post:
      operationId: exchangeGoogleToken
      summary: Exchange a Google ID token for a Khana KarLo session
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken, clientType]
              properties:
                idToken: { type: string, minLength: 20 }
                clientType: { type: string, enum: [android, ios] }
      responses:
        "200":
          description: Authenticated session. Phone consent is a separate action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /customer/profile:
    get:
      operationId: getCustomerProfile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer-owned profile
          content:
            application/json:
              schema:
                type: object
                required: [id, displayName, phoneConsentAt]
                properties:
                  id: { type: string, format: uuid }
                  displayName: { type: [string, "null"] }
                  phoneConsentAt: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /customer/profile/phone-consent:
    put:
      operationId: captureConsentedPhone
      summary: Securely store a phone number after explicit user consent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, consent]
              properties:
                phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
                consent: { const: true }
      responses:
        "200": { description: "Masked phone and consent timestamp; the full number is never returned" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /orders/quotes:
    post:
      operationId: quoteOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId, addressId, items, paymentMethod]
              properties:
                outletId: { type: string, format: uuid }
                addressId: { type: string, format: uuid }
                paymentMethod: { type: string, enum: [cod] }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [menuItemId, quantity, modifierIds]
                    properties:
                      menuItemId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
                      modifierIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
      responses:
        "200": { description: Server-calculated price quote }
        "400": { $ref: "#/components/responses/BadRequest" }
  /orders:
    post:
      operationId: placeOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderPlacement" }
      responses:
        "201": { description: Created order and immutable price snapshot }
        "409": { description: Idempotency key reused with a different request }
        "422": { description: "Menu, outlet or delivery address is no longer eligible" }
  /payment/cod/collections:
    post:
      operationId: recordCodCollection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, amountPaisa]
              properties:
                orderId: { type: string, format: uuid }
                amountPaisa: { type: integer, minimum: 1 }
      responses:
        "201": { description: "Cash collection recorded in the rider custody ledger" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Idempotency conflict or rider custody ceiling reached" }
  /orders/{orderId}/status:
    get:
      operationId: getOrderStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "Owner-authorized order state, history and fresh rider location" }
        "404": { description: Order not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Session:
      type: object
      required: [accessToken, refreshToken, accessExpiresAt, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        user:
          type: object
          required: [id, roles]
          properties:
            id: { type: string, format: uuid }
            roles: { type: array, items: { type: string, enum: [customer, merchant, rider, staff] }, uniqueItems: true }
    OrderPlacement:
      type: object
      required: [outletId, addressId, items, paymentMethod]
      properties:
        outletId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [cod] }
        items: { type: array, minItems: 1, items: { type: object } }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
  responses:
    Unauthorized:
      description: Valid session required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
